name: Build SolarWin packages

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: solarwin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x
  PROJECT_PATH: SolarWin\SolarWin.csproj
  TEST_PROJECT_PATH: SolarWin.Tests\SolarWin.Tests.csproj
  CONFIGURATION: Release
  PLATFORM: x64
  RUNTIME_IDENTIFIER: win-x64

jobs:
  build:
    name: Build, test and package x64
    runs-on: windows-2025-vs2026
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add Visual Studio MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Show build environment
        shell: pwsh
        run: |
          dotnet --version
          msbuild -version

      - name: Read and validate application version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath $env:PROJECT_PATH -Encoding UTF8
          $version = @($project.Project.PropertyGroup.Version)[0].Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "SolarWin.csproj does not contain a Version value."
          }

          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
            if ($tagVersion -ne $version) {
              throw "Tag $env:GITHUB_REF_NAME does not match SolarWin.csproj version $version."
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "SolarWin version: $version"

      - name: Restore application
        shell: pwsh
        run: >-
          msbuild $env:PROJECT_PATH
          /t:Restore
          /p:Configuration=$env:CONFIGURATION
          /p:Platform=$env:PLATFORM
          /p:RuntimeIdentifier=$env:RUNTIME_IDENTIFIER
          /m
          /nologo

      - name: Restore tests
        shell: pwsh
        run: dotnet restore $env:TEST_PROJECT_PATH --nologo

      - name: Run tests
        shell: pwsh
        run: dotnet test $env:TEST_PROJECT_PATH --configuration $env:CONFIGURATION --no-restore --nologo

      - name: Build portable package
        shell: pwsh
        run: |
          $portableDirectory = Join-Path $env:RUNNER_TEMP "solarwin-portable"
          $distDirectory = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $portableDirectory, $distDirectory | Out-Null

          $arguments = @(
            $env:PROJECT_PATH
            "/t:Publish"
            "/p:Configuration=$env:CONFIGURATION"
            "/p:Platform=$env:PLATFORM"
            "/p:RuntimeIdentifier=$env:RUNTIME_IDENTIFIER"
            "/p:WindowsPackageType=None"
            "/p:GenerateAppxPackageOnBuild=false"
            "/p:AppxPackageSigningEnabled=false"
            "/p:SelfContained=true"
            "/p:PublishSingleFile=true"
            "/p:PublishDir=$portableDirectory\"
            "/m"
            "/nologo"
            "/nodeReuse:false"
          )
          & msbuild @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Portable publish failed with exit code $LASTEXITCODE."
          }

          $requiredFiles = @("SolarWin.exe", "SolarWin.Native.dll")
          foreach ($requiredFile in $requiredFiles) {
            $requiredPath = Join-Path $portableDirectory $requiredFile
            if (-not (Test-Path -LiteralPath $requiredPath)) {
              throw "Portable publish is missing $requiredFile."
            }
          }

          $archivePath = Join-Path $distDirectory "SolarWin-${{ steps.version.outputs.version }}-win-x64-portable.zip"
          Compress-Archive -Path (Join-Path $portableDirectory "*") -DestinationPath $archivePath -CompressionLevel Optimal

      - name: Prepare MSIX signing certificate
        id: signing
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:MSIX_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:MSIX_PFX_PASSWORD)

          if ($hasCertificate -xor $hasPassword) {
            throw "Configure both MSIX_PFX_BASE64 and MSIX_PFX_PASSWORD, or leave both unset."
          }
          if ($env:GITHUB_REF -like "refs/tags/v*" -and -not $hasCertificate) {
            throw "A v* release tag requires the MSIX_PFX_BASE64 and MSIX_PFX_PASSWORD repository secrets."
          }

          if ($hasCertificate) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "SolarWin.GitHubActions.pfx"
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:MSIX_PFX_BASE64))
            "certificate_path=$certificatePath" >> $env:GITHUB_OUTPUT
            "signed=true" >> $env:GITHUB_OUTPUT

            $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $certificatePath,
              $env:MSIX_PFX_PASSWORD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            )
            [xml]$manifest = Get-Content -LiteralPath "SolarWin\Package.appxmanifest" -Encoding UTF8
            $publisher = $manifest.Package.Identity.Publisher
            if ($certificate.Subject -ne $publisher) {
              throw "Certificate subject '$($certificate.Subject)' does not match Package.appxmanifest publisher '$publisher'."
            }
            $publicCertificatePath = Join-Path $env:GITHUB_WORKSPACE "dist\SolarWin-${{ steps.version.outputs.version }}-install.cer"
            [IO.File]::WriteAllBytes(
              $publicCertificatePath,
              $certificate.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
            )
            $certificate.Dispose()
          }
          else {
            "signed=false" >> $env:GITHUB_OUTPUT
            "No signing secrets were supplied; this run will produce an unsigned MSIX."
          }

      - name: Build MSIX package
        shell: pwsh
        env:
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
          CERTIFICATE_PATH: ${{ steps.signing.outputs.certificate_path }}
          IS_SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          $msixOutputDirectory = Join-Path $env:RUNNER_TEMP "solarwin-msix"
          $distDirectory = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $msixOutputDirectory | Out-Null

          $arguments = @(
            $env:PROJECT_PATH
            "/t:Build"
            "/p:Configuration=$env:CONFIGURATION"
            "/p:Platform=$env:PLATFORM"
            "/p:RuntimeIdentifier=$env:RUNTIME_IDENTIFIER"
            "/p:WindowsPackageType=MSIX"
            "/p:GenerateAppxPackageOnBuild=true"
            "/p:PublishSingleFile=false"
            "/p:BuildProjectReferences=false"
            "/p:AppxPackageDir=$msixOutputDirectory\"
            "/p:UapAppxPackageBuildMode=SideloadOnly"
            "/p:AppxBundle=Never"
            "/m"
            "/nologo"
            "/nodeReuse:false"
          )

          if ($env:IS_SIGNED -eq "true") {
            $arguments += "/p:AppxPackageSigningEnabled=true"
            $arguments += "/p:PackageCertificateKeyFile=$env:CERTIFICATE_PATH"
            $arguments += "/p:PackageCertificatePassword=$env:MSIX_PFX_PASSWORD"
          }
          else {
            $arguments += "/p:AppxPackageSigningEnabled=false"
          }

          & msbuild @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "MSIX build failed with exit code $LASTEXITCODE."
          }

          $package = Get-ChildItem -LiteralPath $msixOutputDirectory -Recurse -File |
            Where-Object { $_.Extension -in ".msix", ".appx" } |
            Select-Object -First 1
          if ($null -eq $package) {
            throw "MSBuild completed without producing an MSIX package."
          }

          $signatureSuffix = if ($env:IS_SIGNED -eq "true") { "" } else { "-unsigned" }
          $destination = Join-Path $distDirectory "SolarWin-${{ steps.version.outputs.version }}-win-x64$signatureSuffix.msix"
          Copy-Item -LiteralPath $package.FullName -Destination $destination

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $distDirectory = Join-Path $env:GITHUB_WORKSPACE "dist"
          $checksumPath = Join-Path $distDirectory "SHA256SUMS.txt"
          Get-ChildItem -LiteralPath $distDirectory -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash *$($_.Name)"
            } | Set-Content -LiteralPath $checksumPath -Encoding UTF8
          Get-Content -LiteralPath $checksumPath

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SolarWin-${{ steps.version.outputs.version }}-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          name: SolarWin-${{ needs.build.outputs.version }}-packages
          path: release-assets

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "SolarWin $GITHUB_REF_NAME"
          fi
