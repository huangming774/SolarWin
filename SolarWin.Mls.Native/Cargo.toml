[package]
name = "solarwin_mls_native"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
futures = "0.3"
openmls_frb = { path = "vendor/openmls/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
